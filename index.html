<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sporting CP · Mercado Verão 2026</title>
  <script>(function(){const t=localStorage.getItem("theme");if(t!=="light")document.documentElement.setAttribute("data-theme","dark");})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #07A04A;
      --green-dark: #056635;
      --green-light: #dcfce7;
      --white: #ffffff;
      --bg: #f0fdf4;
      --card: rgba(255,255,255,0.92);
      --surface: #f0fdf4;
      --text: #0f1f17;
      --muted: #6b7280;
      --border: rgba(7,160,74,0.18);
      --header-bg: rgba(7,160,74,0.94);
      --shadow: rgba(0,0,0,0.08);

      --status-oficial: #15803d;
      --status-oficial-bg: rgba(7,160,74,0.10);
      --status-fechado: #1d4ed8;
      --status-fechado-bg: rgba(37,99,235,0.10);
      --status-negociacao: #b45309;
      --status-negociacao-bg: rgba(217,119,6,0.10);
      --status-analise: #6b7280;
      --status-analise-bg: rgba(107,114,128,0.08);
      --status-saida-oficial: #b91c1c;
      --status-saida-oficial-bg: rgba(220,38,38,0.10);
      --status-saida-fechada: #6d28d9;
      --status-saida-fechada-bg: rgba(124,58,237,0.10);
      --status-saida-negociacao: #be185d;
      --status-saida-negociacao-bg: rgba(190,24,93,0.10);
      --status-risco: #c2410c;
      --status-risco-bg: rgba(234,88,12,0.10);
      --status-clausula: #0e7490;
      --status-clausula-bg: rgba(14,116,144,0.10);
    }

    [data-theme="dark"] {
      --bg: #060f09;
      --card: rgba(13,25,17,0.78);
      --surface: #0d1f13;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(7,160,74,0.16);
      --green-light: #071a0d;
      --header-bg: rgba(6,15,9,0.90);
      --shadow: rgba(0,0,0,0.4);

      --status-oficial: #22c55e;
      --status-oficial-bg: rgba(7,160,74,0.13);
      --status-fechado: #60a5fa;
      --status-fechado-bg: rgba(37,99,235,0.13);
      --status-negociacao: #fbbf24;
      --status-negociacao-bg: rgba(217,119,6,0.13);
      --status-analise: #94a3b8;
      --status-analise-bg: rgba(148,163,184,0.08);
      --status-saida-oficial: #f87171;
      --status-saida-oficial-bg: rgba(220,38,38,0.13);
      --status-saida-fechada: #c084fc;
      --status-saida-fechada-bg: rgba(124,58,237,0.13);
      --status-saida-negociacao: #f472b6;
      --status-saida-negociacao-bg: rgba(219,39,119,0.13);
      --status-risco: #fb923c;
      --status-risco-bg: rgba(234,88,12,0.13);
      --status-clausula: #22d3ee;
      --status-clausula-bg: rgba(14,116,144,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(7,160,74,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(7,160,74,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(7,160,74,0.20);
      color: white;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .02em;
    }
    .header-badge { width: 34px; height: 34px; object-fit: contain; }
    .header-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .header-dates {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }
    .header-date { font-size: .78rem; opacity: .85; }
    .header-updated { font-size: .68rem; opacity: .65; }
    /* .header-countdown removed — countdown moved to sidebar card */
    .theme-toggle {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px 9px;
      line-height: 1;
      transition: background .15s, border-color .15s;
      flex-shrink: 0;
    }
    .theme-toggle:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.28); }

    /* ── LAYOUT ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── LIST VIEW ── */
    #list-layout {
      display: flex;
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      align-items: flex-start;
    }
    #players-column { flex: 1; min-width: 0; }
    #balance-side {
      width: 172px;
      flex-shrink: 0;
      position: sticky;
      top: 76px;
    }

    /* ── BALANCE CARD (sidebar) ── */
    .balance-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
      margin-top: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .balance-card:hover { border-color: rgba(7,160,74,0.35); box-shadow: 0 0 24px rgba(7,160,74,0.09); }
    .balance-card-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .balance-card-value { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
    .balance-card-value.positive { color: var(--green); }
    .balance-card-value.negative { color: #dc2626; }
    .balance-card-sub { font-size: .7rem; color: var(--muted); margin-top: 8px; line-height: 1.55; }
    .balance-card-hint {
      font-size: .7rem;
      color: var(--green-dark);
      font-weight: 600;
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    @media (max-width: 599px) {
      #list-layout { flex-direction: column-reverse; gap: 0; padding-bottom: 48px; }
      #balance-side { width: 100%; position: static; padding-bottom: 12px; }
      .balance-card { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; }
      .balance-card-label { margin-bottom: 0; white-space: nowrap; flex-shrink: 0; }
      .balance-card-value { font-size: 1.15rem; }
      .balance-card-sub { margin-top: 0; }
      .balance-card-hint { display: none; }
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 24px 0 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-title:first-child { margin-top: 0; }

    /* ── PLAYER CARD ── */
    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .player-card:hover {
      border-color: rgba(7,160,74,0.38);
      box-shadow: 0 0 30px rgba(7,160,74,0.10);
      transform: translateY(-2px);
    }
    .player-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .player-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .player-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .player-info { min-width: 0; }
    .player-name {
      font-weight: 600;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-meta {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .player-card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 12px;
      max-width: 48%;
    }
    .fee-chip {
      white-space: normal;
      text-align: right;
      word-break: break-word;
      line-height: 1.3;
    }
    .chevron { color: var(--muted); font-size: .9rem; }

    /* ── STATUS BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: .67rem;
      font-weight: 600;
      letter-spacing: .03em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge.oficial        { background: var(--status-oficial-bg);        color: var(--status-oficial);        border-color: rgba(7,160,74,0.25); }
    .badge.fechado        { background: var(--status-fechado-bg);        color: var(--status-fechado);        border-color: rgba(37,99,235,0.25); }
    .badge.negociacao     { background: var(--status-negociacao-bg);     color: var(--status-negociacao);     border-color: rgba(217,119,6,0.25); }
    .badge.analise        { background: var(--status-analise-bg);        color: var(--status-analise);        border-color: rgba(107,114,128,0.18); }
    .badge.saida-oficial     { background: var(--status-saida-oficial-bg);     color: var(--status-saida-oficial);     border-color: rgba(220,38,38,0.25); }
    .badge.saida-fechada     { background: var(--status-saida-fechada-bg);     color: var(--status-saida-fechada);     border-color: rgba(124,58,237,0.25); }
    .badge.saida-negociacao  { background: var(--status-saida-negociacao-bg);  color: var(--status-saida-negociacao);  border-color: rgba(190,24,93,0.25); }
    .badge.risco             { background: var(--status-risco-bg);             color: var(--status-risco);             border-color: rgba(234,88,12,0.25); }
    .badge.clausula          { background: var(--status-clausula-bg);          color: var(--status-clausula);          border-color: rgba(14,116,144,0.25); }

    /* ── DETAIL VIEW ── */
    #detail-view { max-width: 720px; margin: 0 auto; padding-bottom: 48px; }

    .detail-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      font-size: .85rem;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color .15s, background .15s;
    }
    .detail-back:hover { background: var(--green-light); color: var(--green-dark); }

    .detail-hero {
      background: linear-gradient(135deg, rgba(7,160,74,0.22), rgba(6,15,9,0.85));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(7,160,74,0.20);
      color: white;
      padding: 28px 20px 24px;
      position: relative;
      overflow: hidden;
    }
    .detail-hero::before {
      content: '';
      position: absolute;
      right: -60px; top: -60px;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(7,160,74,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .detail-hero-inner { max-width: 680px; margin: 0 auto; }
    .detail-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 14px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.4);
    }
    .detail-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .detail-name { font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
    .detail-subtitle { opacity: .85; font-size: .9rem; margin-top: 4px; }
    .detail-badge-wrap { margin-top: 14px; }

    .detail-body { padding: 20px 16px; }
    .detail-section { margin-bottom: 20px; }
    .detail-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .detail-text { font-size: .9rem; line-height: 1.6; color: var(--text); }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .detail-stat-value { font-size: 1.05rem; font-weight: 700; }
    .detail-stat-label { font-size: .72rem; color: var(--muted); margin-top: 2px; }

    .sources-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .sources-list a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .82rem;
      color: var(--green-dark);
      text-decoration: none;
      font-weight: 500;
    }
    .sources-list a:hover { text-decoration: underline; }

    .warning-box {
      background: var(--status-negociacao-bg);
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: .82rem;
      color: #92400e;
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }

    /* ── BALANCE VIEW ── */
    #balance-view { max-width: 720px; margin: 0 auto; padding-bottom: 48px; }
    .balance-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .balance-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .balance-table tr:last-child td { border-bottom: none; }
    .balance-table .bt-name { font-weight: 600; }
    .balance-table .bt-club { color: var(--muted); font-size: .78rem; }
    .balance-table .bt-fee { text-align: right; font-weight: 700; white-space: nowrap; }
    .balance-table .bt-fee-max { color: var(--muted); font-weight: 400; font-size: .75rem; }
    .balance-total-row td { font-weight: 700; background: var(--bg); border-top: 2px solid var(--border); }
    .balance-net-box { margin: 20px 16px 0; padding: 16px; border-radius: 12px; text-align: center; }
    .balance-net-box.positive { background: var(--status-oficial-bg); color: var(--status-oficial); }
    .balance-net-box.negative { background: var(--status-saida-oficial-bg); color: var(--status-saida-oficial); }
    .balance-net-value { font-size: 1.8rem; font-weight: 800; }
    .balance-net-label { font-size: .8rem; margin-top: 4px; opacity: .85; }
    .balance-footnote { margin: 12px 16px 0; font-size: .75rem; color: var(--muted); text-align: center; }

    /* ── UPDATES CARD (sidebar) ── */
    .updates-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      margin-top: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .updates-card:hover { border-color: rgba(7,160,74,0.35); box-shadow: 0 0 24px rgba(7,160,74,0.09); }
    .updates-card-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .updates-card-count { font-size: .9rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .updates-card-time { font-size: .7rem; color: var(--muted); margin-bottom: 8px; }
    .updates-player-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    .updates-player-name { font-size: .78rem; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .updates-more { font-size: .72rem; color: var(--muted); margin-top: 3px; }
    .updates-card-hint {
      font-size: .7rem;
      color: var(--green-dark);
      font-weight: 600;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* ── UPDATES VIEW ── */
    #updates-view { max-width: 720px; margin: 0 auto; padding-bottom: 48px; }
    .updates-view-header {
      padding: 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .updates-view-title { font-size: 1rem; font-weight: 700; }
    .updates-view-sub { font-size: .78rem; color: var(--muted); margin-top: 3px; }
    .dir-tag { font-size: .65rem; font-weight: 700; letter-spacing: .04em; white-space: nowrap; margin-bottom: 4px; }
    .dir-tag.entrada { color: var(--green); }
    .dir-tag.saida   { color: #dc2626; }

    /* ── STALENESS ── */
    .stale-tag { display: inline-block; font-size: .63rem; font-weight: 600; padding: 2px 6px; border-radius: 999px; margin-top: 3px; white-space: nowrap; }
    .stale-tag.stale-muted { background: var(--status-analise-bg); color: var(--muted); }
    .stale-tag.stale-warn  { background: var(--status-negociacao-bg); color: var(--status-negociacao); }
    .vm-tag { display: inline-block; font-size: .68rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── COUNTDOWN CARD (sidebar) ── */
    .countdown-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      margin-top: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .countdown-card-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .countdown-card-value { font-size: 1.35rem; font-weight: 800; line-height: 1.2; color: var(--text); }
    .countdown-card-value.urgent { color: #dc2626; }
    .countdown-card-sub { font-size: .7rem; color: var(--muted); margin-top: 8px; }
    .cd-days { display: block; }
    .cd-time { display: block; font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .05em; }

    @media (max-width: 599px) {
      .countdown-card {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        padding: 12px 14px;
        margin-top: 0;
      }
      .countdown-card-label { margin-bottom: 0; white-space: nowrap; flex-shrink: 0; }
      .countdown-card-value { font-size: 1.05rem; }
      .cd-time { font-size: .9rem; }
      .countdown-card-sub { margin-top: 0; }
    }

    @media (max-width: 599px) {
      .updates-card {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        padding: 12px 14px;
        margin-top: 0;
      }
      .updates-card-label { margin-bottom: 0; white-space: nowrap; flex-shrink: 0; }
      #updates-chip-content { flex: 1; }
      .updates-card-count { margin-bottom: 0; font-size: .85rem; }
      .updates-card-time { margin-bottom: 0; }
      .updates-player-row, .updates-more, .updates-card-hint { display: none; }
    }

    /* ── RATING CARD (sidebar) ── */
    .rating-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      margin-top: 10px;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .rating-card:hover { border-color: rgba(7,160,74,0.35); box-shadow: 0 0 24px rgba(7,160,74,0.09); }

    .dash-recent-card {

const STATUS = {

ou sair por empréstimo com opção de compra — assim que o dinamarquês ficou disponível, Mangas deixou de ser prioridade para os gregos. O emblema mantém-no como opção de reserva, dependente dos exames médicos de Kristiansen. A 16 de julho (20h51) a A Bola relata uma reviravolta: Mangas regressou à pré-época em excelente forma física, foi elogiado internamente pela equipa técnica e apontou um golo na vitória por 4-1 sobre o Celtic num particular em Lagos. Assume-se como reserva natural de Maxi Araújo na esquerda, dando variedade táctica ao plantel — e a sua saída obrigaria o Sporting a investir num substituto, encargo adicional numa janela já orçamentada. O clube mantém-se disponível para uma venda na ordem dos €2-3M, mas sem urgência: só sairá perante uma proposta realmente atrativa. Reviravolta final a 22 de julho (04h13): o Record avança que Mangas vai trocar o Sporting pelo Monza, promovido à Serie A e já com o português Dany Mota no plantel — «já há acordo total entre os clubes», faltando apenas fechar os detalhes contratuais entre o jogador e o clube italiano. Ainda a 22 de julho (08h28) a A Bola revela os valores: empréstimo com opção de compra obrigatória, €1,5M fixos + €300K em objetivos (até €1,8M), contrato de 3 épocas + 1 opcional. Negociações em fase decisiva, acordo praticamente selado. Mangas deverá falhar o Troféu 5 Violinos frente ao Mónaco (sábado) devido à saída iminente. Ainda a 22 de julho (15h53) a A Bola confirma viagem marcada: Mangas voa na quinta-feira de manhã para a Lombardia, onde fará exames médicos — oficialização possível dentro de horas caso tudo corra bem. Estrutura confirmada: empréstimo com opção de compra obrigatória em 2027. A 23 de julho (10h28) a A Bola confirma a chegada: Mangas aterrou em Itália (aeroporto de Malpensa, Milão) na quinta-feira de manhã, para fechar a mudança para o Monza — vai realizar exames médicos antes de assinar. Oficialização aguardada nas próximas horas. OFICIAL a 24 de julho (11h03/11h07): A Bola e Record confirmam — Mangas é reforço do Monza por empréstimo com obrigação de compra em 2027, €1,5M fixos + €300K em objetivos (até €1,8M), empréstimo até 30 de junho de 2027. O Sporting despediu-se do jogador nas redes sociais.",

    description: "Capitão do Sporting CP, o médio dinamarquês tem interesse de vários grandes clubes. O Real Madrid de Mourinho chegou a ser associado, e Arsenal e Manchester United também acompanham. O Atlético de Madrid é contudo o clube mais activo: em fevereiro de 2026 apresentou uma proposta de €25M (recusada pelo Sporting), e existe um acordo tácito com Hjulmand que lhe permite sair por €40-50M, abaixo da cláusula de €80M. A 2 de junho o Atlético de Madrid volta à carga com proposta de €40M + €6M/ano para Hjulmand. A 11 de junho o O Jogo revela que o Atlético de Madrid formalizou proposta de €40M ao Sporting. O dinamarquês quer sair e acordou com Varandas uma saída abaixo da cláusula de €80M. A 16 de junho o AC Milan de Rúben Amorim surge na corrida (Di Marzio via O Jogo), com Hjulmand e Trincão como 'dois favoritos' do técnico — o Atlético mantém posição privilegiada. A 21 de junho o O Jogo revela que Varandas prometeu formalmente a Hjulmand que lhe permitirá sair por ~€40M. Braço-de-ferro entre Atlético (€40M + €6M/ano) e AC Milan (Amorim). A 25 de junho a A Bola revela que o Manchester City de Enzo Maresca também está atento: Hugo Viana — diretor desportivo dos citizens e o mesmo que trouxe Hjulmand do Lecce para o Sporting em 2023 — tem o dossiê na mesa. Situação ainda em fase embrionária; o City tem outras prioridades (Elliot Anderson, Sandro Tonali), mas o interesse é real. A 26 de junho o Record confirma que Hjulmand já se despediu dos companheiros de equipa e do staff técnico — sinal inequívoco de que a saída está praticamente decidida. O capitão acredita que o futuro ficará resolvido antes do arranque da pré-época. O AC Milan de Rúben Amorim surge como o clube que mais pressiona nesta fase, com o factor pessoal do técnico — que trouxe Hjulmand do Lecce em 2023 e lhe entregou a braçadeira — a pesar de forma determinante. A 28 de junho a Gazzetta dello Sport garante que houve reunião em Lisboa entre Rúben Amorim e a direção do AC Milan (Hendrik Almstadt, DG, e Bobby Gardiner, scouting) para alinharem estratégia de mercado — Hjulmand é prioridade do técnico. Em simultâneo, o diário espanhol AS reitera que o Atlético de Madrid também persegue o dinamarquês como reforço prioritário para o meio-campo. A 30 de junho — sem propostas concretas formalizadas — Hjulmand apresenta-se na pré-época do Sporting em Alcochete, conforme confirmado pela A Bola, prometendo comprometimento total enquanto aguarda resolução do futuro. O interesse do Atlético de Madrid intensifica-se, com Simeone a aprovar a contratação e o clube disposto a pagar os €40M exigidos pelo Sporting. A 1 de julho, no segundo dia de trabalhos em Alcochete (primeiro treino sob Rui Borges, 29 jogadores presentes), Hjulmand surge como 'a ausência de peso' do plantel — ao contrário do dia anterior, não compareceu. O Sapo/A Bola nota que o pré-acordo que já tem com o Atlético de Madrid, ainda por formalizar junto do Sporting, 'pode mesmo fazer com que acabe por não comparecer em Alcochete' — o sinal mais forte até agora de que a saída é iminente. A 2 de julho o Atlético de Madrid dá o passo seguinte: faz uma abordagem concreta ao Sporting (não apenas ao jogador) para iniciar as negociações formais pela transferência. Sporting mantém o mínimo de €40M (acordo tácito desde verão de 2025), Atlético procura fechar por perto desse valor + bónus; Sporting pode tentar subir o valor. Ainda a 2 de julho (19h22) Frederico Varandas confirma publicamente que o Sporting REJEITOU a proposta formal do Atlético: «Recebemos uma proposta do Atlético de Madrid, que rejeitámos, está longe do valor que pretendemos.» O Record revela os valores exatos a 3 de julho: o Atlético ofereceu €30M + €5M em bónus — bem abaixo do mínimo de €40M exigido pelo Sporting. Varandas garante que qualquer proposta abaixo do valor estabelecido será recusada e que Hjulmand e representantes conhecem esse patamar. A A Bola confirma às 12h02 de 3 de julho: o Sporting exige €40M fixos, de preferência com bónus ad nsferência — o Atlético quer fechar o negócio antes de 13 de julho, data do regresso da equipa aos treinos, segundo a Marca. Sporting mantém-se nos €40M+bónus, Atlético na proposta de €35M — semana considerada decisiva para resolver o diferencial de €5M. O O Jogo confirma às 17h16 de 7 de julho que o acordo entre os CLUBES (não apenas com o jogador) está agora iminente — os empresários de Hjulmand encontram-se em Madrid para «acertarem os derradeiros pormenores». Diego Simeone regressa em breve das férias nos EUA e quer o dinamarquês disponível para o arranque da pré-época, marcado para segunda-feira. O Record (via Marca, 07h03 de 8 de julho) confirma que os representantes de Hjulmand — da agência BTAM — reuniram-se ontem em Madrid com Mateu Alemany, diretor desportivo do Atlético, para fechar os últimos detalhes. Objetivo do clube espanhol: ter o negócio fechado até segunda-feira. O Record acrescenta (8 de julho) que as boas relações com Mateu Alemany foram determinantes para os colchoneros subirem a parada: acordo agora desenhado nos €40M fixos + €5M variáveis, o tal 'bolo' de €45M — Sporting e Atlético 'muito perto de chegarem a acordo'. Proposta formal do Atlético esperada nas próximas horas. A 9 de julho (08h41, atualizado 09h33) a A Bola confirma: negócio FECHADO entre Sporting e Atlético de Madrid — €40M fixos + €5M em bónus, contrato de 5 épocas até 2031. Hjulmand viaja já hoje para Madrid, mas fará antes uma despedida em Lisboa. Chegou do Lecce há 3 anos por €19,5M — 141 jogos, 10 golos, 12 assistências, 2 campeonatos e 1 Taça de Portugal ao serviço do Sporting. A A Bola detalha (11h58) a estrutura dos €5M em bónus: até €3M em prémios individuais (€750k por cada série de 30 jogos com 45+ minutos sob Simeone, até um máximo de 120 jogos) e até €2M em prémios coletivos ligados ao percurso do Atlético na Champions League (€500k qualificação, €250k oitavos, €250k quartos, €500k meias, €1M final) — bónus cumulativos, atingíveis no mesmo ano. Contrato de 5 épocas ra-se agora mais recetivo à Arábia Saudita como alternativa. Negócio esperado para se resolver durante ou logo após o Mundial. O Record confirma às 04h01 de 6 de julho que o negócio está muito avançado — 'muito perto' de se fechar: o Al Ahli colocou em cima da mesa uma proposta milionária (~€50M entre fixo e variáveis), com Rui Pedro Braz (diretor desportivo português do Al Ahli) a liderar as negociações. Trincão estaria disposto a aceitar — o salário saudita pode chegar a 4x o que aufere no Sporting. O Jogo confirma negociações avançadas e detalhes da investida saudita. O O Jogo confirma às 09h26 de 7 de julho: proposta oficial chegou a 6 de julho, com finalização de contrato na noite desse mesmo dia — €44-45M fixos + pequenas variáveis (investimento total ~€90M incluindo os 4 anos de contrato/salário). Contrato de 4 épocas até 2030. Salário líquido anual de €11M — fator decisivo que mudou a preferência inicial de Trincão pela Premier League. Trincão substituiria Riyad Mahrez, cujo contrato com o Al Ahli termina. Anúncio oficial esperado «nas próximas horas». A A Bola confirma às 14h01 de 12 de julho: «Acordo fechado» entre Sporting e Al Ahli — negócio total de €45M. Falta apenas o «sim» do próprio Trincão, que ainda resiste à mudança para o Médio Oriente, na esperança de uma proposta da Premier League (jogou antes pelo Wolverhampton). O Al Ahli (Rui Pedro Braz, diretor desportivo) propõe contrato de 4 épocas até 2030, salário líquido anual acima de €10M (~4x o que aufere no Sporting). O Sporting já contratou Rodrigo Zalazar (Sp. Braga, €30M) como substituto direto nas responsabilidades táticas sob Rui Borges. A 14 de julho (08h17) o O Jogo confirma: acordo entre clubes fechado, faltam apenas trâmites burocráticos/documentais — oficialização «cada vez mais perto». Sporting apura um lucro base de €18,5M com a venda, mais bónus ligados a objetivos. Nos dias seguintes, um restaurante em Guimarães despede-se publicamente de Trincão («Boa sorte para o teu próximo desafio»), sinal simbólico de que a saída é dada como certa nos bastidores, apesar de a assinatura formal ainda não ter sido anunciada. A A Bola confirma (17/07 20h47) que a saída está «na reta final»: o acordo entre clubes mantém-se em €45M, mas Trincão está agora a negociar os seus termos pessoais — o Al Ahli propõe €10-11M líquidos/ano num contrato de 4 épocas, e o jogador pretende subir para €12-12,5M/ano, com «as partes muito próximas de um consenso». A oficialização só deverá acontecer quando Trincão regressar das férias pós-Mundial (jogou apenas 26 minutos na competição). O Sporting terá de recrutar um extremo capaz de jogar na ala ou na posição de 10 para o substituir. A 18 de julho a transferência é OFICIALIZADA: comunicado à CMVM (Sporting SAD é sociedade cotada) confirma valor total de até $50M (~€45,7M incluindo mecanismo de solidariedade) — €39,3M fixos + até €4,4M variáveis por objetivos (€43,7M no negócio-base). Al Ahli assume ainda ~€2M de mecanismo de solidariedade a clubes formadores e 10% de comissões de intermediação sobre os valores recebidos pelo Sporting. Contrato até 2030. Rui Pedro Braz (diretor desportivo do Al Ahli) esteve presente na formalização. Trincão, de férias, promete despedida formal dos adeptos do Sporting no regresso: «Sinto-me muito orgulhoso por me juntar ao Al Ahli e conheço o valor deste clube, a sua história e os seus adeptos» — a paixão da massa adepta foi um dos principais incentivos para aceitar a mudança. O negócio entra no top 10 de vendas mais caras da história do Sporting, atrás do recorde de Viktor Gyökeres, e surge poucos dias depois da saída de Morten Hjulmand (Atl. Madrid) ter já mexido nesse ranking.",
    notes: "✅ OFICIAL (18/07) — €39,3M fixos + até €4,4M variáveis (€43,7M base, até $50M/€45,7M com solidariedade). Contrato até 2030. Comunicado à CMVM. Trincão: «orgulhoso por me juntar ao Al Ahli».",

    description: "Defesa central marfinense de 22 anos, tornou-se o líder da defesa do Sporting após a saída de Gonçalo Inácio. Renovou contrato em Janeiro de 2026 até 2030, com cláusula de rescisão de €80M. O Crystal Palace foi o primeiro clube inglês a mostrar interesse. A 9 de junho o O Jogo revela interesse de Leeds, Chelsea, Arsenal e Bournemouth. A 10 de junho a Abola revela que o Leeds está disposto a fazer a maior contratação da sua história: proposta de €40M + €10M variáveis (total até €50M), o que superaria o recorde do clube (€40.5M por Rutter em 2022). Chelsea, Arsenal, Man United, Newcastle e Crystal Palace também na corrida. Nenhuma proposta formal chegou ao Sporting, que não cede abaixo dos €80M da cláusula. O Mundial 2026 com a Costa do Marfim poderá aumentar a sua cotação. A 18 de junho o O Jogo revela que o Como — clube italiano que disputará a próxima Champions League — se juntou ao cerco por Diomande, tornando-se o quarto clube na corrida ao lado de Leeds, Bournemouth e Chelsea. A 27 de junho a A Bola revela o 'novo plano' do Sporting: posicioná-lo como 'patrão da defesa' em 2026/27. O clube não tem intenção de o vender — mesmo com o Leeds activo — e mantém a cláusula de €80M como piso intransponível. Diomande ganhou estatuto de titular durante o Mundial com a Costa do Marfim. Situação reconfirmada a meio de julho: Chelsea, Leeds e Crystal Palace continuam associados ao jogador, mas sem qualquer proposta formal junto do Sporting — o clube mantém-se irredutível nos €80M da cláusula. A 21 de julho (16h52) muda de figura: a A Bola revela que é o Nottingham Forest quem está agora mais avançado — €40M fixos + até €5M em objetivos (total €45M) já em cima da mesa, valor que o Sporting considera insuficiente, pedindo mais próximo dos €50M. O técnico do Forest, Oliver Glasner, referenciou Diomande pessoalmente desde os tempos em que o seguia no Crystal Palace. As negociações estão em curso, com resolução esperada dentro de dias — o Sporting terá de procurar um substituto no mercado caso o negócio se concretize. Nos dias seguintes (22-23 de julho) o valor de referência estabiliza perto dos €40M — Fabrizio Romano confirma acordo entre clubes a caminho nessa ordem, com oficialização «esperada nos próximos dias» mas ainda não fechada. A imprensa portuguesa já assume o encaixe como praticamente garantido: a A Bola nota que a venda de Diomande financia por si só a contratação de Ibrahima Ba (€21,25M) e ainda sobra margem (~€20M) para um novo lateral-esquerdo, reforço que se torna necessário com a saída de Ricardo Mangas para o Monza. A 23 de julho (16h31) a A Bola detalha a estrutura completa do negócio, agora na «reta final» com conclusão esperada dentro de horas: valor fixo mínimo de €40M, bónus adicionais ligados a objetivos individuais e coletivos, e o Sporting garante ainda 10% de uma futura mais-valia caso o Forest volte a vender o jogador — total esperado à volta dos €45M com bónus. Falta apenas acertar a estrutura final de pagamento. A 27 de julho (11h00) a A Bola confirma que a operação está «prestes a ficar concluída», com fecho esperado bem antes de sexta-feira — data do particular entre Sporting e Nottingham Forest no Algarve (21h45), que Diomande poderá disputar já pelo lado inglês. O Sporting já garantiu o substituto (Ibrahima Ba, €21,25M). A 28 de julho (09h00) a A Bola explica os atrasos: Evangelos Marinakis, dono grego do Nottingham Forest (também ligado a Rio Ave e Olympiakos), é um negociador «extravagante» conhecido por arrastar negócios — já tinha feito o mesmo com a transferência de Jota Silva para o Sporting no verão passado, que caiu «por uma questão de minutos» no fecho do mercado. O Forest tenta agora reduzir o valor fixo de €40M pedido pelo Sporting, atrasando o processo, apesar da boa relação entre o diretor-geral leonino Bernardo Morais Palmeiro e Marinakis (de tempos comuns no Rio Ave). Ainda assim, poucas horas depois (12h16) a A Bola confirma que o entendimento entre os clubes está «perto de ficar fechado», com fecho esperado dentro de horas — €40M fixos mínimos + bónus (até €45M) + 10% de revenda futura, antes do particular de sexta-feira com o Nottingham Forest. A 29 de julho (08h50) o O Jogo reforça: Sporting e Nottingham Forest estão «cada vez mais perto de um acordo total» — Varandas mantém-se irredutível nos valores pedidos, discussões remanescentes centram-se em bónus e percentagem de revenda futura, sem risco de fazer cair o negócio. Diomande deverá assinar contrato de 5 épocas. Glasner queria contar com ele já no particular de sexta-feira frente ao Sporting, mas a transferência iminente pode impedir a sua participação. O Record nota a 30 de julho (03h15) que Diomande segue «sem lugar reservado» no particular de amanhã (sexta-feira, Algarve) — precisamente porque é o Nottingham Forest, adversário desse jogo, quem negoceia os seus direitos; Rui Borges decidirá a sua utilização em função do andamento das negociações. O Record revela a 4 de agosto (05h02) que a goleada do Sporting sobre o Forest (4-1, 31/07) «fez soar o alarme» junto de Glasner: o técnico austríaco, preocupado com a capacidade defensiva da equipa antes do arranque da Premier League, pressionou a direção a acelerar a contratação. Os valores aproximam-se: Sporting exige €40M fixos + €5M em bónus, Forest já oferece €38M fixos + €4M em incentivos — a diferença reduziu-se para apenas €3M. Glasner quer o reforço «até ao final da semana», com Diomande a retomar treinos já na terça-feira. Reviravolta a 6 de agosto: o Maisfutebol avança que o negócio com o Nottingham Forest CAIU, devido a «fortes divergências» entre os dirigentes dos dois clubes — seria necessária uma mudança radical na relação entre os emblemas para o revivalismo da transferência. Notícia desmentida horas depois (15h48) pelas Notícias ao Minuto, citando fontes próximas do processo: Sporting e Nottingham Forest «continuam a conversar» sobre a possível saída — Diomande já tem tudo acertado a nível pessoal com o Forest, falta o acordo entre clubes. A proposta mais recente do Forest chegou aos €40M, mas o Sporting quer o valor máximo dado a importância do jogador. A cláusula de rescisão de €80M mantém-se intacta desde a renovação de janeiro até 2030. A venda pode gerar mais de €40M de lucro, verba já reservada para reforços adicionais, incluindo Irankunda. O Record reconfirma ainda a 6 de agosto (17h57) que as negociações continuam ativas mas a «ritmo lento» — Sporting exige pelo menos €40M, Forest não quer ultrapassar esse valor sem incluir variáveis, e o impasse arrasta-se há semanas sem sinais de aceleração. Reviravolta na véspera da estreia: ao contrário do que se assumia (exclusão da pré-época e ausência da estreia), o DN confirma a 7 de agosto (13h10) que Rui Borges CONVOCOU Diomande para o jogo de estreia da Liga frente ao Estrela da Amadora (sábado, 20h30) — o treinador desvaloriza o «ruído» do mercado: «Estou zero preocupado. É natural que, até ao fecho do mercado, exista muito ruído», confirmando que o central «está convocado» e continua a ser tratado como um dos jogadores do plantel apesar da saga com o Forest. Ainda a 7 de agosto (08h33) o O Jogo precisa os valores actualizados do impasse: Sporting exige agora €50M (com bónus incluídos), enquanto o Nottingham Forest recusa ultrapassar os €40M + variáveis por objetivos — representantes de ambos os clubes vão reunir-se de novo nos próximos dias, mas o desfecho não deverá acontecer antes do jogo de estreia. Diomande já tem acordo pessoal com o Forest, falta o acordo entre clubes. À noite (21h10) a A Bola oferece uma leitura estratégica da convocatória: mais do que 'ruído normal de mercado', a decisão de Rui Borges de chamar Diomande serve um duplo propósito — colmatar a falta de centrais disponíveis (Debast e Ba também indisponíveis) e, em simultâneo, fazer pressão negocial sobre Evangelos Marinakis, dono do Forest, mostrando que o Sporting não tem pressa de vender. DESFECHO a 8 de agosto (16h41): a A Bola confirma que o negócio está FECHADO entre Sporting e Nottingham Forest — reuniões finais na manhã de sábado resolveram o diferencial nos termos de pagamento que travava o acordo. Estrutura final: €40M fixos, sem variáveis (valor inferior aos €45-50M com bónus que se discutiam nos dias anteriores). Apesar de ter sido inicialmente incluído na convocatória para o jogo de estreia frente ao Estrela da Amadora, Diomande não deverá afinal participar, dada a saída iminente — parte para Inglaterra no início da semana para se juntar a Oliver Glasner. Confirmação a 9 de agosto (10h23): a A Bola avança que Diomande já viaja para Inglaterra para se submeter aos exames médicos obrigatórios — foi dispensado do treino de recuperação do Sporting em Alcochete no domingo de manhã. Aguarda-o um contrato até 2031 no Nottingham Forest. «Depois de avanços e recuos, o negócio está feito!», resume a A Bola. Diomande entra assim no top-10 de vendas mais caras da história do Sporting. O Record acrescenta (9 de agosto, 17h58) o capítulo final em Alcochete: Diomande fez as despedidas aos companheiros depois do jogo-treino frente ao Mafra (vitória por 3-1) — antigo clube do central, o que lhe permitiu reencontrar-se com ex-colegas e staff do Mafra, incluindo Juan Andrade, que lhe dedicou uma despedida nas redes sociais («um grande homem»). Exames médicos agendados para domingo, antes da assinatura oficial pelo Nottingham Forest. Confirmação a 10 de agosto (13h41): a A Bola avança que Diomande está em Londres a realizar os exames médicos. Por questões logísticas, a oficialização como reforço do Nottingham Forest só deverá acontecer «durante o dia de amanhã» (terça-feira). A A Bola confirma ao final do dia 10 de agosto (22h06) que a oficialização deverá mesmo acontecer esta terça-feira à tarde — um dia descrito como «muito movimentado» em Alvalade, coincidindo com a chegada de Irankunda a Lisboa para exames médicos. OFICIAL a 11 de agosto (11h43): o Nottingham Forest confirma a contratação — €40M, contrato de 4 épocas + 1 opcional. Diomande: «Estou muito feliz por estar aqui. É um clube histórico e isso motivou-me a assinar. Acredito que podemos alcançar grandes coisas esta época.» George Syrianos, diretor desportivo do Forest, elogiou o reforço: «O Diomande é um central poderoso e imponente que chega com mentalidade vencedora. Tem uma experiência fantástica para a idade, tendo desempenhado papéis cruciais em equipas campeãs.» Fecha a passagem de 3 épocas pelo Sporting (desde 2023, vindo do Midtjylland): 132 jogos, 7 golos, 2 campeonatos e 1 Taça de Portugal. O Sporting confirma à CMVM (11 de agosto, 13h23) os valores oficiais: contrapartida financeira de €40M, encargos de intermediação de €1,5M a cargo da SAD leonina, e mecanismo de solidariedade repartido em partes iguais entre Sporting e Nottingham Forest. Diomande tinha custado €7,5M ao Midtjylland em 2023, mais até €5M em bónus por objetivos — todos entretanto atingidos —, o que traduz um lucro superior a €25M nesta venda.",
    notes: "✅ OFICIAL (Nottingham Forest 11/08 11h43): €40M, contrato de 4 épocas + 1 opcional. Valores confirmados à CMVM (13h23): €1,5M de intermediação a cargo do Sporting, solidariedade repartida a meias. Custou €7,5M+€5M de bónus (todos atingidos) ao Midtjylland em 2023 — lucro superior a €25M.",

cio que o levou ao Watford), e os ingleses estão a negociar com os alemães a compra dessa percentagem antes de fechar a venda ao Sporting — o que ajuda a explicar o atraso. Apesar disso, o negócio é descrito como «praticamente garantido»: Irankunda já rejeitou propostas concorrentes de Hull City, Lille e Club Brugge, comprometido apenas com o Sporting pela perspetiva de Champions League. O Record revela a 31 de julho (05h02) que Irankunda reuniu pessoalmente com Scott Duxbury, CEO do Watford, e «saiu esclarecido» dessa conversa — sinal de que o jogador tem agora uma noção mais clara do seu percurso, apesar de Duxbury reiterar publicamente o desejo de o manter mais uma época. Quer ser jogador do Sporting e trabalha activamente nesse sentido. O impasse nos valores mantém-se: Sporting não sobe dos €15M+€5M em objetivos, Watford insiste nos €20M. A 1 de agosto (17h55) a A Bola nota que Irankunda continua, entretanto, a vestir a camisola do Watford: foi decisivo num particular de pré-época ante o Brentford (vitória por 1-0), ao sofrer a grande penalidade que Kjerrumgaard converteu — sinal de que, apesar de tudo, a transferência continua por fechar e o jogador segue a treinar-se e a competir por Inglaterra enquanto o impasse nos valores persiste. A A Bola revela (dado inicialmente como 02/08 mas confirmado apenas a 03/08 devido a inconsistência nas datas da fonte) que o Sporting perdeu a paciência com o impasse e já ativou um 'plano B': sem abandonar Irankunda por completo, a estrutura leonina intensificou a observação de alternativas para a ala esquerda, não querendo ficar refém de um único negócio. Flávio Gonçalves e Jesse Derry (reforço vindo do Chelsea) têm impressionado na pré-época e posicionam-se como opções viáveis para titularizar na estreia da Liga frente ao Estrela da Amadora, caso o impasse com o Watford não se resolva dentro de dias — prazo interno que o Sporting definiu para si próprio. O Jogo confirma a 3 de agosto (10h10) que o processo entre Sporting e Irankunda está agora concluído — falta apenas o entendimento entre Watford e Bayern Munique sobre o corte de 40% numa futura venda. Frederico Varandas dá prioridade a fechar este negócio para que Rui Borges possa começar a trabalhar com o jogador. A A Bola precisa a 4 de agosto (21h12): o acordo entre Sporting e Watford está fechado — €15M fixos + variáveis que podem elevar o total a €20M — e Irankunda vai assinar contrato de 5 épocas, até 2031. Falta apenas o Watford reduzir substancialmente a percentagem retida pelo Bayern Munique (40% de uma futura mais-valia, do negócio que o levou de Munique para Inglaterra por €4M) para tornar a proposta do Sporting aceitável. Assim que alemães e ingleses chegarem a entendimento, Irankunda viaja para Lisboa para exames médicos antes de assinar. Rui Borges quer integração rápida — o Sporting recusa prolongar mais a negociação. DESFECHO a 6 de agosto (00h26): o O Jogo confirma que o obstáculo do Bayern Munique foi finalmente resolvido — os alemães chegaram a entendimento com o Watford sobre a percentagem de 40% retida numa futura venda, desbloqueando o negócio. Estrutura final: €15M fixos + €3M em objetivos (até €18M) + percentagem de revenda futura, contrato de 5 épocas. Irankunda já recebeu autorização para viajar para Lisboa, onde fará os habituais exames médicos antes de assinar — chegada esperada durante o fim de semana. Vai ser mais uma opção de Rui Borges no ataque, podendo jogar em qualquer uma das alas. A A Bola confirma ao final do dia 10 de agosto (22h06) a data exata: Irankunda aterra esta terça-feira em Lisboa para se submeter aos habituais exames médicos em Alcochete, no mesmo dia em que se espera a oficialização da saída de Diomande — descrito como um dia «muito movimentado» em Alvalade. Chegada confirmada a 11 de agosto (22h58, Record): Irankunda aterrou em Lisboa e falou pela primeira vez como reforço em vias de assinatura — «Estou muito feliz por estar aqui e ter a oportunidade de jogar na Champions League» e «Sou um jogador muito rápido». É o 8º reforço do Sporting nesta janela. Exames médicos marcados para quarta-feira, antes da assinatura formal do contrato de 5 épocas (€15M fixos, até €18M com objetivos). Exames médicos concluídos sem problemas a 12 de agosto — visitou a Academia de Alcochete e conheceu os novos companheiros de equipa. OFICIAL a 13 de agosto: o Sporting confirma Irankunda como o seu 8º reforço da época 2026/27, com contrato assinado até junho de 2031 (5 épocas), protegido por cláusula de rescisão de €80M. Passa a treinar sob as ordens de Rui Borges — reforço direto para as alas, especialmente o corredor esquerdo, onde a saída anunciada de Pedro Gonçalves tinha deixado uma lacuna.",
    notes: "✅ OFICIAL (13/08): Sporting confirma Irankunda como 8º reforço da temporada — contrato até 2031 (5 épocas), cláusula de rescisão €80M. €15M fixos + €3M em objetivos (até €18M) + revenda futura. Fecha uma novela de quase um mês desde os primeiros contactos com o Watford.",

function badge(statusKey) {
  const s = STATUS[statusKey];
  return `<span class="badge ${s.cls}">${s.label}</span>`;
}

const RUMOR_STATUSES = new Set(["analise", "negociacao", "risco", "saida_negociacao"]);

function daysAgo(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.floor((today - new Date(dateStr)) / 86400000);
}

function staleTag(p) {
  if (!RUMOR_STATUSES.has(p.status) || !p.last_news) return "";
  const d = daysAgo(p.last_news);
  if (d < 8)  return "";
  if (d < 15) return `<span class="stale-tag stale-muted">há ${d}d</span>`;
  return `<span class="stale-tag stale-warn">há ${d}d</span>`;
}

function renderCountdown() {
  const CLOSE = new Date("2026-09-01T00:00:00");
  const valEl = document.getElementById("countdown-value");
  const subEl = document.getElementById("countdown-sub");
  if (!valEl) return;

  function tick() {
    const diff = CLOSE - new Date();
    if (diff <= 0) {
      valEl.innerHTML = "—";
      valEl.className = "countdown-card-value";
      if (subEl) subEl.textContent = "Janela fechada";
      clearInterval(window._cdTimer);
      return;
    }
    const total = Math.floor(diff / 1000);
    const d = Math.floor(total / 86400);
    const h = Math.floor((total % 86400) / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const p = n => String(n).padStart(2, "0");
    valEl.innerHTML = `<span class="cd-days">${d}d</span><span class="cd-time">${p(h)}:${p(m)}:${p(s)}</span>`;
    valEl.className = "countdown-card-value" + (d <= 7 ? " urgent" : "");
    if (subEl) subEl.textContent = "fecho: 31 ago 2026";
  }

  clearInterval(window._cdTimer);
  tick();
  window._cdTimer = setInterval(tick, 1000);
}

// ── BALANCE ──────────────────────────────────────────────────────────────────
function computeBalance() {
  const incoming  = PLAYERS.filter(p => p.status === "oficial" && p.fee_value != null);
  const outgoing  = PLAYERS.filter(p => p.status === "saida_oficial" && p.fee_value != null);
  const clausulas = PLAYERS.filter(p => p.status === "clausula" && p.fee_value != null);
  const totalIn        = incoming.reduce((s, p) => s + p.fee_value, 0);
  const totalOutDireto  = outgoing.reduce((s, p) => s + p.fee_value, 0);
  const totalClausulas  = clausulas.reduce((s, p) => s + p.fee_value, 0);
  const totalOut = totalOutDireto + totalClausulas;
  return { incoming, outgoing, clausulas, totalIn, totalOut, totalOutDireto, totalClausulas, net: totalOut - totalIn };
}

function fmtM(v) {
  return (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)) + "M";
}

function parseVM(s) {
  if (!s) return null;
  const clean = s.replace("€", "").trim();
  if (clean.endsWith("M")) return parseFloat(clean) || 0;
  if (clean.endsWith("k")) return (parseFloat(clean) || 0) / 1000;
  return parseFloat(clean) || null;
}

function gradeClass(g) {
  if (g.startsWith("A")) return "grade-A";
  if (g.startsWith("B")) return "grade-B";
  if (g.startsWith("C")) return "grade-C";
  if (g === "D") return "grade-D";
  return "grade-F";
}

function computeRating() {
  // Index 1: Saldo financeiro
  const { totalIn, totalOut, net } = computeBalance();
  const score1 = Math.max(0, Math.min(10, (net + 60) / 90 * 10));

  // Index 2: Eficiência de compras (fee vs VM for oficial incoming with fee > 0)
  const incomingPaid = PLAYERS.filter(p => p.status === "oficial" && p.fee_value != null && p.fee_value > 0);
  const buyRatios = incomingPaid.map(p => { const vm = parseVM(p.market_value); return vm ? p.fee_value / vm : null; }).filter(r => r != null);
  let score2 = 5;
  let avgBuy = null;
  if (buyRatios.length > 0) {
    avgBuy = buyRatios.reduce((s, r) => s + r, 0) / buyRatios.length;
    score2 = Math.max(0, Math.min(10, (2 - avgBuy) * 5));
  }

  // Index 3: Eficiência de vendas (fee vs VM for saida_oficial with fee > 0)
  const outgoingPaid = PLAYERS.filter(p => p.status === "saida_oficial" && p.fee_value > 0);
  const sellRatios = outgoingPaid.map(p => { const vm = parseVM(p.market_value); return vm ? p.fee_value / vm : null; }).filter(r => r != null);
  let score3 = 5;
  let avgSell = null;
  if (sellRatios.length > 0) {
    avgSell = sellRatios.reduce((s, r) => s + r, 0) / sellRatios.length;
    score3 = Math.max(0, Math.min(10, avgSell * 5));
  }

  // Index 4: Reforço do plantel (VM of official transfers only)
  const CONF_IN  = ["oficial"];
  const CONF_OUT = ["saida_oficial"];
  const vmIn  = PLAYERS.filter(p => CONF_IN.includes(p.status))
                       .reduce((s, p) => s + (parseVM(p.market_value) || 0), 0);
  const vmOut = PLAYERS.filter(p => CONF_OUT.includes(p.status))
                       .reduce((s, p) => s + (parseVM(p.market_value) || 0), 0);
  const vmNet = vmIn - vmOut;
  const score4 = Math.max(0, Math.min(10, 5 + vmNet / 15));

  // Index 5: Perda de activos-chave (saida_oficial with VM >= 10M)
  const keyLost = PLAYERS.filter(p => p.status === "saida_oficial" && (parseVM(p.market_value) || 0) >= 10).length;
  const score5 = Math.max(0, Math.min(10, 10 - keyLost * 3));

  const indices = [
    { label: "Saldo financeiro",     score: score1,
      detail: `Net: ${net >= 0 ? "+" : "−"}€${fmtM(Math.abs(net))}` },
    { label: "Eficiência de compras", score: score2,
      detail: avgBuy != null ? `Ratio médio: ${avgBuy.toFixed(2)}× VM` : "Sem dados" },
    { label: "Eficiência de vendas",  score: score3,
      detail: avgSell != null ? `Ratio médio: ${avgSell.toFixed(2)}× VM` : "Sem dados" },
    { label: "Reforço do plantel",   score: score4,
      detail: `VM líquida: ${vmNet >= 0 ? "+" : "−"}€${fmtM(Math.abs(vmNet))}` },
    { label: "Activos-chave perdidos", score: score5,
      detail: `${keyLost} saída${keyLost !== 1 ? "s" : ""} com VM ≥ €10M` },
  ];

  const overall = indices.reduce((s, i) => s + i.score, 0) / indices.length;
  const grade = overall >= 8.5 ? "A+" : overall >= 7.5 ? "A" : overall >= 6.5 ? "B+" :
                overall >= 5.5 ? "B"  : overall >= 4.5 ? "C+" : overall >= 3.5 ? "C" :
                overall >= 2.5 ? "D"  : "F";
  return { indices, overall, grade };
}

function renderBalanceChip() {
  const { totalIn, totalOut, net } = computeBalance();
  const chip = document.getElementById("balance-chip");

  const sign = net >= 0 ? "+" : "−";
  chip.textContent = sign + "€" + fmtM(Math.abs(net));
  chip.className = "balance-card-value " + (net >= 0 ? "positive" : "negative");
  sub.innerHTML = "Receitas: €" + fmtM(totalOut) + "<br>Gastos: €" + fmtM(totalIn);

function renderBalance() {
  const { incoming, outgoing, clausulas, totalIn, totalOutDireto, totalClausulas, net } = computeBalance();
  const sign = net >= 0 ? "+" : "−";
  const cls  = net >= 0 ? "positive" : "negative";

  function tableRows(players, mode) {
    // mode: "in" (entrada, mostra fromClub) | "out" (saída direta, mostra toClub) | "clausula" (mostra toClub + fromClub original)
    return players.map(p => {
      const club = mode === "in" ? p.fromClub : p.toClub;
      const feeStr = p.fee_value === 0
        ? (mode === "in" ? "Sem valor" : "Fim de contrato / Sem valor")
        : "€" + fmtM(p.fee_value);
      const maxExtra = (p.fee_max != null && p.fee_max > p.fee_value)
        ? ` <span class="bt-fee-max">(até €${fmtM(p.fee_max)})</span>` : "";
      return `<tr>
        <td><div class="bt-name">${p.name}</div><div class="bt-club">${club}</div></td>
        <td class="bt-fee">${feeStr}${maxExtra}</td>
      </tr>`;
    }).join("");
  }

  function totalRow(label, value) {
    return `<tr class="balance-total-row">
      <td>${label}</td>
      <td class="bt-fee">€${fmtM(value)}</td>
    </tr>`;
  }

  const clausulasSection = clausulas.length ? `
    <div style="padding:20px 16px 0">
      <div class="detail-label" style="margin-bottom:10px">💰 Cláusulas / Vendas Indiretas</div>
      <table class="balance-table">
        ${tableRows(clausulas, "clausula")}
        ${totalRow("Total cláusulas", totalClausulas)}
      </table>
    </div>` : "";

  document.getElementById("balance-content").innerHTML = `
    <div class="balance-net-box ${cls}">
      <div class="balance-net-value">${sign}€${fmtM(Math.abs(net))}</div>
      <div class="balance-net-label">Saldo líquido (transferências oficiais + cláusulas)</div>
    </div>
    <div style="padding:20px 16px 0">
      <div class="detail-label" style="margin-bottom:10px">🚨 Saídas Oficiais</div>
      <table class="balance-table">
        ${tableRows(outgoing, "out")}
        ${totalRow("Total receitas (vendas diretas)", totalOutDireto)}
      </table>
    </div>
    ${clausulasSection}
    <div style="padding:20px 16px 0">
      <div class="detail-label" style="margin-bottom:10px">✅ Entradas Oficiais</div>
      <table class="balance-table">
        ${tableRows(incoming, "in")}
        ${totalRow("Total gastos", totalIn)}
      </table>
    </div>
    <div class="balance-footnote">Transferências oficialmente anunciadas pelo clube; cláusulas incluem receita de revenda/solidariedade FIFA de ex-jogadores</div>`;
}

  const gradeDesc = overall >= 8.5 ? "excelente" : overall >= 7.5 ? "muito bom" :
                    overall >= 6.5 ? "bom"        : overall >= 5.5 ? "razoável"  :
                    overall >= 4.5 ? "mediano"     : overall >= 3.5 ? "fraco"     : "muito fraco";

  const finVal  = fin.detail.replace("Net: ", "").replace("−", "−");
  const finText = fin.score >= 6.5
    ? `Saldo financeiro ${finVal} — receitas igualam ou superam o investimento.`
    : fin.score >= 4
    ? `Saldo financeiro ${finVal} — investimento moderadamente acima das receitas.`
    : `Saldo financeiro ${finVal} — investimento claramente superior às receitas.`;

  const buyText = buy.detail === "Sem dados"
    ? `<div class="rating-narrative-item">⚪ Eficiência de compras — sem contratações com fee confirmado para avaliar.</div>`
    : item(buy.score, buy.score >= 6.5
        ? `Compras eficientes (${buy.detail}) — valores pagos abaixo do mercado.`
        : buy.score >= 4
        ? `Compras razoáveis (${buy.detail}) — próximas do valor de mercado.`
        : `Compras caras (${buy.detail}) — prémios acima do valor de mercado.`);

  const sellText = sell.detail === "Sem dados"
    ? `<div class="rating-narrative-item">⚪ Eficiência de vendas — sem vendas com fee confirmado para avaliar.</div>`
    : item(sell.score, sell.score >= 6.5
        ? `Vendas acima do valor de mercado (${sell.detail}) — forte capacidade negocial.`
        : sell.score >= 4
        ? `Vendas equilibradas (${sell.detail}) — próximas do valor de mercado.`
        : `Vendas abaixo do valor de mercado (${sell.detail}) — margem negocial limitada.`);

  const squadText = squad.score >= 6.5
    ? `Plantel reforçado em valor de mercado (${squad.detail}) — entradas de maior qualidade que as saídas.`
    : squad.score >= 4
    ? `Valor de mercado do plantel estável (${squad.detail}) — substituições equivalentes.`
    : `Plantel enfraquecido (${squad.detail}) — saídas mais valiosas do que as entradas.`;

  const keyText = keyLoss.score >= 8
    ? `Nenhum activo-chave perdido — continuidade e estabilidade no plantel.`
    : keyLoss.score >= 5
    ? `${keyLoss.detail} — perda importante, mas gerível.`
    : `${keyLoss.detail} — impacto significativo na qualidade do plantel.`;

  const narrative = `
    <div class="rating-narrative">
      <div class="rating-narrative-title">Interpretação</div>
      <div class="rating-narrative-intro">Com <strong>${overall.toFixed(1)} pontos</strong> (nota <strong>${grade}</strong>), este é um mercado <strong>${gradeDesc}</strong>. Aqui está o que mais influencia a nota:</div>
      ${item(fin.score, finText)}${buyText}${sellText}${item(squad.score, squadText)}${item(keyLoss.score, keyText)}
    </div>`;

  const indexCards = indices.map(idx => `
    <div class="rating-index">
      <div class="rating-index-header">
        <span class="rating-index-name">${idx.label}</span>
        <span class="rating-index-score ${gradeClass(idx.score >= 8.5 ? "A+" : idx.score >= 7.5 ? "A" : idx.score >= 6.5 ? "B+" : idx.score >= 5.5 ? "B" : idx.score >= 4.5 ? "C+" : idx.score >= 3.5 ? "C" : idx.score >= 2.5 ? "D" : "F")}">${idx.score.toFixed(1)}</span>
      </div>
      <div class="rating-bar-bg"><div class="rating-bar-fill ${barClass(idx.score)}" style="width:${idx.score * 10}%"></div></div>
      <div class="rating-index-detail">${idx.detail}</div>
    </div>`).join("");

  document.getElementById("rating-content").innerHTML = `
    <div class="rating-hero">
      <div class="rating-hero-grade ${gc}">${grade}</div>
      <div class="rating-hero-score">${overall.toFixed(1)} / 10</div>
      <div class="rating-hero-label">Avaliação global do mercado de verão 2026</div>
    </div>
    ${narrative}
    <div class="rating-indices">${indexCards}</div>
    <div class="balance-footnote">Baseado em transferências confirmadas e valores de mercado (Transfermarkt)</div>`;
}

// ── UPDATES ──────────────────────────────────────────────────────────────────
function getTodayUpdates() {
  const today = LAST_UPDATED.split(" ")[0];
  const entry = UPDATES_LOG.find(e => e.date === today);
  if (!entry) return [];
  return entry.ids.map(id => PLAYERS.find(p => p.id === id)).filter(Boolean);
}

function renderUpdatesChip() {
  const players = getTodayUpdates();
  const chip = document.getElementById("updates-chip-content");
  const time = LAST_UPDATED.split(" ")[1];

  if (!players.length) {
    chip.innerHTML = `<div class="updates-card-count" style="color:var(--muted);font-weight:400;font-style:italic">Sem atualizações hoje</div>`;
    return;
  }

  const preview = players.slice(0, 3);
  const extra = players.length - 3;
  let rows = preview.map(p =>
    `<div class="updates-player-row">
      ${badge(p.status)}
      <span class="updates-player-name">${p.name}</span>
    </div>`
  ).join("");
  if (extra > 0) rows += `<div class="updates-more">+${extra} mais</div>`;

  chip.innerHTML =
    `<div class="updates-card-count">${players.length} jogador${players.length > 1 ? "es" : ""}</div>` +
    `<div class="updates-card-time">${time}</div>` +
    rows;
}

function renderUpdates() {
  const players = getTodayUpdates();
  const [year, month, day] = LAST_UPDATED.split(" ")[0].split("-");
  const months = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const dateStr = `${parseInt(day)} ${months[parseInt(month)-1]} ${year}`;
  const time = LAST_UPDATED.split(" ")[1];

  if (!players.length) {
    document.getElementById("updates-content").innerHTML =
      `<div style="padding:32px 16px;text-align:center;color:var(--muted)">Sem atualizações hoje.</div>`;
    return;
  }

  let cards = "";
  for (const p of players) {
    const isOutgoing = ["saida_oficial","saida_fechada","saida_negociacao","risco"].includes(p.status);
    const clubMeta = p.status === "clausula" ? `${p.fromClub} → ${p.toClub}` : (isOutgoing ? p.toClub : p.fromClub);
    const meta = [p.position, p.age ? `${p.age} anos` : null, clubMeta].filter(Boolean).join(" · ");
    const feeLabel = p.fee || "";
    const avatarImg = p.photo
      ? `<img src="${p.photo}" alt="${p.name}" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=this.parentNode.dataset.emoji" />`
      : p.emoji;
    const dirTag = p.status === "clausula"
      ? `<div class="dir-tag saida">💰 Cláusula</div>`
      : isOutgoing
        ? `<div class="dir-tag saida">↑ Saída</div>`
        : `<div class="dir-tag entrada">↓ Entrada</div>`;
    cards += `
      <div class="player-card" onclick="showDetail('${p.id}')">
        <div class="player-card-left">
          <div class="player-avatar" data-emoji="${p.emoji}">${avatarImg}</div>
          <div class="player-info">
            <div class="player-name">${p.name}</div>
            <div class="player-meta">${meta}</div>
          </div>
        </div>
        <div class="player-card-right">
          ${dirTag}
          ${badge(p.status)}
          ${feeLabel ? `<span style="font-size:.75rem;color:var(--muted)">${feeLabel}</span>` : ""}
        </div>
      </div>`;
  }

  document.getElementById("updates-content").innerHTML =
    `<div class="updates-view-header">
      <div class="updates-view-title">📰 Atualizações de hoje</div>
      <div class="updates-view-sub">${dateStr} · ${time} · ${players.length} jogador${players.length > 1 ? "es" : ""}</div>
    </div>
    <div style="padding:16px 16px 0">${cards}</div>`;
}

// ── RENDER DETAIL ────────────────────────────────────────────────────────────
function renderDetail(id) {
  const p = PLAYERS.find(x => x.id === id);
  if (!p) return;

  const isIn = ["oficial","fechado","negociacao","analise"].includes(p.status);
  const clubLine = p.status === "clausula"
    ? `${p.fromClub} <span style="opacity:.7">→</span> ${p.toClub}`
    : isIn
      ? `${p.fromClub} <span style="opacity:.7">→</span> Sporting CP`
      : `Sporting CP <span style="opacity:.7">→</span> ${p.toClub}`;

  const lastNewsStat = (() => {
    if (!RUMOR_STATUSES.has(p.status) || !p.last_news) return null;
    const d = daysAgo(p.last_news);
    const months = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    const [y, m, day] = p.last_news.split("-");
    const label = `${parseInt(day)} ${months[parseInt(m)-1]}`;
    const style = d >= 15 ? `color:var(--status-negociacao)` : d >= 8 ? `color:var(--muted)` : "";
    return { value: `<span${style ? ` style="${style}"` : ""}>${label} <span style="font-size:.8em;opacity:.75">(há ${d}d)</span></span>`, label: "Última notícia" };
  })();

  const stats = [
    p.position      ? { value: p.position,         label: "Posição" } : null,
    p.age           ? { value: `${p.age} anos`,     label: "Idade" } : null,
    p.fee           ? { value: p.fee,               label: "Valor estimado" } : null,
    p.market_value  ? { value: p.market_value,      label: "Valor de mercado" } : null,
    p.contract      ? { value: p.contract,          label: "Contrato" } : null,
    lastNewsStat,
  ].filter(Boolean);

  const statsHtml = stats.length
    ? `<div class="detail-grid">${stats.map(s =>
        `<div class="detail-stat">
          <div class="detail-stat-value">${s.value}</div>
          <div class="detail-stat-label">${s.label}</div>
        </div>`).join("")}</div>` : "";

  const sourcesHtml = p.sources.length
    ? `<div class="detail-section">
        <div class="detail-label">Fontes</div>
        <ul class="sources-list">${p.sources.map(s =>
          `<li><a href="${s.url}" target="_blank">↗ ${s.label}</a></li>`
        ).join("")}</ul>
       </div>` : "";

  const notesHtml = p.notes
    ? `<div class="warning-box notes-box"><ul class="notes-list">${
        p.notes.replace(/\.\s*$/, "").split(/\.\s+/).map(b => `<li>${b}</li>`).join("")
      }</ul></div>` : "";

  document.getElementById("detail-content").innerHTML = `
    <div class="detail-hero">
      <div class="detail-hero-inner">
        <div class="detail-avatar" data-emoji="${p.emoji}">${p.photo ? `<img src="${p.photo}" alt="${p.name}" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=this.parentNode.dataset.emoji" />` : p.emoji}</div>
        <div class="detail-name">${p.name}</div>
        <div class="detail-subtitle">${clubLine}</div>
        <div class="detail-badge-wrap">${badge(p.status)}</div>
      </div>
    </div>
    <div class="detail-body">
      ${statsHtml}
      <div class="detail-section">
        <div class="detail-label">Situação</div>
        <ul class="desc-list">${
          p.description.replace(/\.\s*$/, "").split(/\.\s+/).map(b => `<li>${b}</li>`).join("")
        }</ul>
        ${notesHtml}
      </div>
      ${sourcesHtml}
    </div>`;
}

let _currentView  = "dashboard-view";
let _previousView = "dashboard-view";

  ["dashboard-view","entradas-view","saidas-view","clausulas-view","detail-view","balance-view","updates-view","rating-view"]
    .forEach(v => { const el = document.getElementById(v); if (el) el.classList.toggle("active", v === id); });

  window.scrollTo(0, 0);
}

function isUpdatedToday(id) {
  return getTodayUpdates().some(p => p.id === id);
}

function playerCardHtml(p) {

  const meta = [p.position, p.age ? `${p.age} anos` : null, clubMeta].filter(Boolean).join(" · ");
